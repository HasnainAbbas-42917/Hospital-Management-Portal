<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Hospital Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-auth">
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>Create your account</h1>
      <p>Register as a patient to book appointments, or sign in with staff credentials provided by the hospital administration.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-box">
       <a href="/" class="back-to-home">&larr; Back to Home</a>
          <div class="role-banner">✚ <span id="roleBannerText">Patient Registration</span></div>
        <h2>Register</h2>

        <div class="role-tabs" id="roleTabs">
          <button type="button" class="role-tab active" data-role="patient">Patient</button>
          <button type="button" class="role-tab" data-role="doctor">Doctor</button>
          <button type="button" class="role-tab" data-role="receptionist">Receptionist</button>
          <button type="button" class="role-tab" data-role="admin">Admin</button>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" required placeholder="Your full name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-field-wrap">
              <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
              <button type="button" class="password-toggle" onclick="togglePassword('password', this)">&#128065;</button>
            </div>
          </div>
          <div class="patient-profile-fields" id="patientProfileFields">
            <div class="field">
              <label for="phone">Phone number</label>
              <input type="tel" id="phone" placeholder="e.g. 0300 1234567">
            </div>
            <div class="profile-grid">
              <div class="field">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob">
              </div>
              <div class="field">
                <label for="gender">Gender</label>
                <select id="gender">
                  <option value="">Select</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label for="address">Address</label>
              <textarea id="address" rows="2" placeholder="Street, area, city"></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="text-muted mt-24">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <footer class="portal-footer" style="margin-top:0; padding:16px; border-top:none;">
    <strong>Hospital Portal</strong> — Patient, Doctor, Receptionist & Admin access
  </footer>

  <script src="/static/js/api.js"></script>
  <script>
    function togglePassword(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const isHidden = input.type === "password";
      input.type = isHidden ? "text" : "password";
      btn.innerHTML = isHidden ? "&#128584;" : "&#128065;";
    }

    let selectedRole = "patient";
    const profileFields = document.getElementById("patientProfileFields");
    const doctorId = new URLSearchParams(window.location.search).get("doctor_id");
    if (doctorId) {
      document.querySelectorAll(".role-tab").forEach((tab) => {
        if (tab.dataset.role !== "patient") tab.hidden = true;
      });
    }
    document.querySelector('a[href="/login"]').href = doctorId
      ? "/login?doctor_id=" + encodeURIComponent(doctorId)
      : "/login";

    document.querySelectorAll(".role-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".role-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        selectedRole = tab.dataset.role;
        document.getElementById("roleBannerText").textContent = tab.dataset.role.charAt(0).toUpperCase() + tab.dataset.role.slice(1) + " Registration";
        profileFields.hidden = selectedRole !== "patient";
      });
    });

    const form = document.getElementById("registerForm");
    const alertBox = document.getElementById("alert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        role: selectedRole,
      };
      if (selectedRole === "patient") {
        payload.phone = document.getElementById("phone").value || null;
        payload.dob = document.getElementById("dob").value || null;
        payload.gender = document.getElementById("gender").value || null;
        payload.address = document.getElementById("address").value || null;
      }

      try {
        const data = await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        saveSession(data.access_token, data.role);

        const destinations = {
          admin: "/admin/dashboard",
          doctor: "/doctor/dashboard",
          receptionist: "/receptionist/dashboard",
          patient: "/patient/dashboard",
        };
        window.location.href = data.role === "patient" && doctorId
          ? "/patient/dashboard?doctor_id=" + encodeURIComponent(doctorId)
          : destinations[data.role] || "/login";
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
