<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Hospital Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>Create your account</h1>
      <p>Register as a patient to book appointments, or sign in with staff credentials provided by the hospital administration.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-box">
        <h2>Register</h2>

        <div class="role-tabs" id="roleTabs">
          <button type="button" class="role-tab active" data-role="patient">Patient</button>
          <button type="button" class="role-tab" data-role="doctor">Doctor</button>
          <button type="button" class="role-tab" data-role="receptionist">Receptionist</button>
          <button type="button" class="role-tab" data-role="admin">Admin</button>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
          <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" required placeholder="Your full name">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="text-muted mt-24">
          Already have an account? <a href="/login">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    let selectedRole = "patient";
    document.querySelectorAll(".role-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".role-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        selectedRole = tab.dataset.role;
      });
    });

    const form = document.getElementById("registerForm");
    const alertBox = document.getElementById("alert");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        role: selectedRole,
      };

      try {
        const data = await apiFetch("/auth/register", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        saveSession(data.access_token, data.role);

        const destinations = {
          admin: "/admin/dashboard",
          doctor: "/doctor/dashboard",
          receptionist: "/receptionist/dashboard",
          patient: "/patient/dashboard",
        };
        window.location.href = destinations[data.role] || "/login";
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    });
  </script>
</body>
</html>
