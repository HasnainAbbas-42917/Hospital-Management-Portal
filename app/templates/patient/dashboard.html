{% extends "patient/base_patient.html" %}
{% block title %}Find Doctors — Patient Portal{% endblock %}

{% block content %}
  <h1>Find a doctor</h1>
  <p class="text-muted">Search by specialization or keyword, then book a time that works for you.</p>

  <div class="search-bar">
    <input type="text" id="specialization" placeholder="Specialization (e.g. Cardiology)">
    <input type="text" id="keyword" placeholder="Keyword (e.g. skin, heart)">
    <button class="btn btn-primary" onclick="searchDoctors()">Search</button>
  </div>

  <div id="doctorResults" class="doctor-grid"></div>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal-box">
      <div class="flex-between">
        <h3 id="modalDoctorName">Book Appointment</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalAlert" class="alert"></div>
      <form id="bookingForm">
        <input type="hidden" id="bookingDoctorId">
        <div class="field">
          <label for="apptDate">Date</label>
          <input type="date" id="apptDate" required>
        </div>
        <div class="field">
          <label for="apptTime">Time</label>
          <input type="time" id="apptTime" required>
        </div>
        <div class="field">
          <label for="apptReason">Reason for visit</label>
          <textarea id="apptReason" rows="3" placeholder="Briefly describe your symptoms or reason"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Request appointment</button>
      </form>
    </div>
  </div>
{% endblock %}

{% block scripts %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
