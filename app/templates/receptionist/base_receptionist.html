<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Receptionist Portal{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-receptionist">
  <div class="topbar-mobile">
    <div>
      <div class="brand" style="font-size:1rem; margin-bottom:0;">Hospital Portal</div>
      <div class="topbar-subtitle">Receptionist Portal</div>
    </div> 
       <button class="btn btn-secondary" style="padding:6px 12px;" onclick="logout()">Logout</button>
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Hospital Portal</div>
      <div class="sidebar-subtitle">Receptionist Portal</div>
      <nav>
        <a href="/receptionist/dashboard" class="{% if active == 'appointments' %}active{% endif %}">Appointments</a>
        <a href="/receptionist/attendance" class="{% if active == 'attendance' %}active{% endif %}">Attendance</a>
        <a href="/receptionist/profile" class="{% if active == 'profile' %}active{% endif %}">My Profile</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      {% block content %}{% endblock %}
            <footer class="portal-footer"><strong>Hospital Portal</strong> — Receptionist Portal</footer>
    </main>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!requireAuth("receptionist")) { /* redirected already */ }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
