<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Doctor Portal{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-doctor">
    <div class="topbar-mobile">
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
      <div>
        <div class="brand" style="font-size:1rem; margin-bottom:0;">Hospital Portal</div>
        <div class="topbar-subtitle">Patient Portal</div>
      </div>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="notif-bell-wrap">
        <button class="notif-bell">🔔<span class="notif-badge"></span></button>
        <div class="notif-panel">
          <div class="notif-panel-header">
            <h4>Notifications</h4>
            <button class="notif-mark-all" onclick="markAllNotifRead()">Mark all read</button>
          </div>
          <div class="notif-list"></div>
        </div>
      </div>
      <button class="btn btn-secondary" style="padding:6px 12px;" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="sidebar-overlay" onclick="closeSidebar()">
  </div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Hospital Portal</div>
      <div class="sidebar-subtitle">Doctor Portal</div>
        <nav>
        <a href="/doctor/dashboard" class="{% if active == 'appointments' %}active{% endif %}">Appointments</a>
        <a href="/doctor/patients" class="{% if active == 'patients' %}active{% endif %}">My Patients</a>
        <a href="/doctor/profile" class="{% if active == 'profile' %}active{% endif %}">My Profile</a>
        <a href="/doctor/attendance" class="{% if active == 'attendance' %}active{% endif %}">Attendance</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      {% block content %}{% endblock %}
            <footer class="portal-footer"><strong>Hospital Portal</strong> — Doctor Portal</footer>
    </main>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    if (!requireAuth("doctor")) { /* redirected already */ }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
